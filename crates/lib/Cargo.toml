[package]
name = "eidetica"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true

[features]
default = ["full"]
full = ["y-crdt", "sqlite", "postgres", "service"]
service = []
y-crdt = ["dep:yrs"]
sqlite = ["dep:sqlx"]
postgres = ["dep:sqlx"]
# Exposes internal testing utilities: FixedClock, Instance::*_with_clock, the
# `testing` module (Cluster/Peer), and other internal hooks.
#
# NOT FOR PRODUCTION. These hooks let a caller move the clock, reach past
# visibility boundaries, and drive internals the public API deliberately does not
# expose. Deliberately excluded from `default` and `full`, and no workspace member
# may take it as a normal dependency — doing so would compile the hooks into every
# release binary built with `--workspace`. Enable it in dev-dependencies and test
# invocations only.
testing = []

[dependencies]
chrono = { workspace = true }
base64ct = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
cid = { workspace = true }
multihash-codetable = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
yrs = { workspace = true, optional = true }
libc = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
iroh = { workspace = true }
iroh-tickets = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }
handle_trait = { workspace = true }
sqlx = { workspace = true, optional = true }
# Transitive dep version floors (see workspace Cargo.toml for rationale)
time = { workspace = true }
postcard = { workspace = true }
postcard-derive = { workspace = true }
z32 = { workspace = true }
instability = { workspace = true }
url = { workspace = true }

# Ignore transitive deps that are only here to set version floors
[package.metadata.cargo-udeps.ignore]
normal = ["time", "postcard", "postcard-derive", "z32", "instability"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ctor = { workspace = true }
ipld-core = { workspace = true }

# The integration suite reaches for hooks that only exist under `testing`, so it
# is declared explicitly rather than auto-discovered: without the feature cargo
# skips the target instead of failing to compile it.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["testing"]

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "backend_benchmarks"
harness = false

[[bench]]
name = "iroh_benchmarks"
harness = false

[[bench]]
name = "table_cache_benchmarks"
harness = false

[[bench]]
name = "cbor_deserialize"
harness = false
