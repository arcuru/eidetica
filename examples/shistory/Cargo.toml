[package]
name = "shistory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shell history example using an Eidetica daemon"
publish = false

[features]
# Opt-in test hooks; not enabled in normal builds.
testing = []

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
eidetica = { path = "../../crates/lib", features = ["service"] }
serde = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
eidetica = { path = "../../crates/lib", features = ["service", "sqlite", "testing"] }
tempfile = { workspace = true }
