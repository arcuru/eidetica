# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Each suppression below is a deliberate, reviewed exception; new findings
# should be fixed, not added here. The gate runs at zizmor's default persona.
# Ignores are pinned by line so a shifted target reports rather than masks.
rules:
  dangerous-triggers:
    ignore:
      # Docs follows the complete CI/dev-publish pipeline to use its warm cache.
      # The job requires successful same-repository main push/manual CI before
      # checking out its SHA; a PR (including a fork branch named main) is refused.
      - deploy-docs.yml:14
  template-injection:
    ignore:
      # `steps.nix.outputs.push-args` is a first-party output of our setup-nix
      # composite (pre-quoted Nix store paths), not attacker-controllable input
      # — see the comment at that step in publish.yml.
      - publish.yml:136
  secrets-inherit:
    ignore:
      # PAT_TOKEN reaches the reusable workflow through its own
      # `environment: automation`. A job that calls a reusable workflow cannot
      # declare an environment itself, so passing the secret explicitly here
      # would read it outside that environment and hand over an empty value.
      - actions-update.yml:24
      - cargo-update.yml:24
      - flake-update.yml:24
      - update-hold.yml:24
  ref-version-mismatch:
    ignore:
      # dtolnay/rust-toolchain publishes no releases and distributes via
      # branches, so `# master` names the branch the pin tracks rather than a
      # version; zizmor resolves it as a ref and reports the expected divergence
      # from the branch tip. Deps: Actions Audit covers these pins instead,
      # failing when the pinned commit is no longer reachable from that branch.
      - release-plz-pr.yml:35
      - release-plz-release.yml:44
