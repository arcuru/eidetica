# Required status check that blocks merging dependency-update PRs during their
# hold period: passes immediately for non-deps/ branches and fails while the PR
# still carries the "on-hold" label. Delegates to the arcuru/actions reusable
# workflow.
name: "Deps: Hold Gate"

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  hold:
    uses: arcuru/actions/.github/workflows/dependency-hold.yml@31c804a9c15602300e5e292e80cac1ad5512a21a # v0.2.0
    with:
      runs-on: ubicloud-standard-2
