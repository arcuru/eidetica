# Required status check that blocks merging dependency-update PRs during their
# hold period: passes immediately for non-deps/ branches and fails while the PR
# still carries the "on-hold" label. Delegates to the arcuru/actions reusable
# workflow.
name: "Deps: Hold Gate"

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  hold:
    uses: arcuru/actions/.github/workflows/dependency-hold.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      runs-on: ubicloud-standard-2
