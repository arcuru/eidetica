# Monthly cargo dependency update: runs `cargo update` to bump Cargo.lock and
# opens a PR on the deps/cargo-update branch with a configurable hold period
# before merge. Delegates to the arcuru/actions reusable workflow; CI verifies
# via the normal PR checks.
name: "Deps: Cargo Update"

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cargo-update:
    uses: arcuru/actions/.github/workflows/cargo-update.yml@ec6897e9561bdefa62d5eb364d49b41bcba122a5 # v0.4.0
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      runs-on: ubicloud-standard-2
      environment: automation
      enable-magic-cache: "false"
      extra-substituters: https://cache.eidetica.dev
      extra-trusted-public-keys: cache.eidetica.dev-1:eND5gRJlbnool3ZLCWT2H8kkygWS8JcsU76HYXbWPBI=
    secrets: inherit
