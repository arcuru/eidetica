# Monthly Nix flake input update: runs `nix flake update` to bump flake.lock
# and opens a PR on the deps/flake-update branch with a configurable hold
# period before merge. Delegates to the arcuru/actions reusable workflow; CI
# verifies via the normal PR checks.
name: "Deps: Flake Update"

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  flake-update:
    uses: arcuru/actions/.github/workflows/flake-update.yml@c8144123ad5a2c6316b7becab8233b68dfa637d9 # v0.2.1
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      runs-on: ubicloud-standard-2
      environment: automation
      enable-magic-cache: "false"
      extra-substituters: https://cache.eidetica.dev
      extra-trusted-public-keys: cache.eidetica.dev-1:eND5gRJlbnool3ZLCWT2H8kkygWS8JcsU76HYXbWPBI=
    secrets: inherit
