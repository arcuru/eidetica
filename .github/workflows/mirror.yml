name: Mirror

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror:
    uses: arcuru/actions/.github/workflows/codeberg-mirror.yml@ec6897e9561bdefa62d5eb364d49b41bcba122a5 # v0.4.0
    with:
      runs-on: ubicloud-standard-2
      environment: mirror
      destination: git@code.jackson.dev:arcuru/eidetica.git
      host: code.jackson.dev
      host-key: "code.jackson.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDPsnswuXB8WNSv756SxOsNjoUirmyUJiZgysoCU8EZk"
