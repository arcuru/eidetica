name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Main CI and its dependent dev publisher share one native queue: finish the
# active pipeline and keep one replaceable pending pipeline. PRs only supersede
# their own checks; other branches cannot displace main.
concurrency:
  group: >-
    ${{ github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        'ci-dev-main' ||
        format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (x86_64-linux)
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # PRs use the existing lean SQLite-only test target. Integration and the
      # full backend/documentation checks remain push/dispatch-only.
      - name: Checks
        if: github.event_name == 'pull_request'
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#legacyPackages.x86_64-linux.ci-pr'

      # On push/dispatch: build checks + integration in ONE nix-fast-build
      # invocation. nix-fast-build only takes a single target, so we point it at
      # the `.#legacyPackages.x86_64-linux.ci` aggregate (checks + integration).
      # A single dependency graph shares testCheckArtifacts (built once) and lets
      # the integration VM's serial boot/run overlap the check compiles, instead
      # of the two running back-to-back as separate steps.
      - name: Checks + integration
        if: github.event_name != 'pull_request'
        run: |
          nix-fast-build --skip-cached --no-nom --no-link \
            -f '.#legacyPackages.x86_64-linux.ci'

  ci-arm:
    name: CI (aarch64-linux)
    if: github.event_name != 'pull_request'
    runs-on: ubicloud-standard-16-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Checks
        run: |
          nix-fast-build --skip-cached --no-nom --no-link

  publish:
    name: Publish
    needs: [ci, ci-arm]
    if: |
      github.repository_owner == 'arcuru' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    with:
      dev: true
    permissions:
      contents: read
      packages: write
    # Naming environment secrets is required for reusable workflows; their
    # values are resolved inside the callee's protected publish/release jobs.
    secrets:
      BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
